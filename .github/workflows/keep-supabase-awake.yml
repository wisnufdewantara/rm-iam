# Supabase Free menghentikan (pause) project setelah ~7 hari tanpa aktivitas.
#
# Untuk portofolio itu risiko terbesar proyek ini: matinya diam-diam, dan yang
# menemukan pertama kali bisa jadi orang yang sedang menilai. Satu query kecil
# per hari sudah cukup menghitung sebagai aktivitas.
#
# Gratis: GitHub Actions untuk repo publik tidak menghabiskan kuota, dan tidak
# terpengaruh batas 1 cron/hari di Vercel Hobby.
#
# Yang dipakai hanya PUBLISHABLE key — aman ditaruh sebagai secret maupun
# variable, karena RLS yang menjaga. Secret key TIDAK dipakai di sini.
#
# Nilainya dibaca dari `secrets` MAUPUN `vars`, jadi ditaruh di tab mana pun
# sama jalannya. Yang penting: taruh di tingkat REPOSITORY, bukan di dalam
# Environment — secret/variable milik Environment hanya terbaca kalau job-nya
# menyatakan `environment:`, dan job ini tidak.
#   Settings -> Secrets and variables -> Actions
#   -> "New repository secret" atau "New repository variable"
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 2 * * *" # 09:17 WIB setiap hari
  workflow_dispatch: # bisa dipicu manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sentuh database
        env:
          URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY belum terbaca."
            echo "Taruh di tingkat REPOSITORY (bukan di dalam Environment):"
            echo "  Settings -> Secrets and variables -> Actions"
            echo "  -> New repository secret  ATAU  New repository variable"
            echo "Periksa ejaannya: SUPABASE_URL dan SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          # Baca satu baris settings — query paling murah yang tetap dihitung aktivitas.
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/settings?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"; cat /tmp/out.json
          # 200 = hidup. Kode lain berarti project sedang pause atau ada yang salah.
          [ "$code" = "200" ]
